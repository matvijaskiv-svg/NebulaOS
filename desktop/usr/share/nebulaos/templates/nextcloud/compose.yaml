# NebulaOS: Nextcloud — your own cloud (files, photos, calendar) on port 8080.
# First visit http://<this computer>:8080 and create the admin account.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: nextcloud-db
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["./db:/var/lib/mysql"]
  app:
    image: nextcloud:latest
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [db]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud-db
    volumes: ["./data:/var/www/html"]
