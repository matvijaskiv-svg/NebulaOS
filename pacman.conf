# pacman.conf, который mkarchiso использует при сборке ISO
# (на установленную систему не влияет).
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# multilib для Live-образа не нужен (32-битных пакетов в списке нет).
#[multilib]
#Include = /etc/pacman.d/mirrorlist
